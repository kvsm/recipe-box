# Builds the app on GitHub's servers whenever the code changes, runs the tests,
# and puts the installable APK on a "Latest build" release you can open on your phone.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee -a build-log.txt

      - name: Build APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a build-log.txt

      # If anything fails: surface compile errors as annotations, and put the full log on the
      # "ci-log" branch so it can be read with plain git.
      - name: Share the failure log
        if: failure()
        run: |
          grep -E "^e: |^w: .*error|What went wrong|Execution failed|FAILED$" build-log.txt | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          git config user.name "build bot"
          git config user.email "actions@users.noreply.github.com"
          cp build-log.txt /tmp/build-log.txt
          git checkout --orphan ci-log
          git rm -rfq . || true
          cp /tmp/build-log.txt build-log.txt
          echo "${GITHUB_SHA}" > commit.txt
          git add build-log.txt commit.txt
          git commit -qm "Build log for ${GITHUB_SHA::7}"
          git push -f origin ci-log

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: recipe-box-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to the "Latest build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk recipe-box.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest recipe-box.apk \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Open this page on your phone and tap recipe-box.apk to install." \
            --prerelease
