[versions]
agp = "8.7.3"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
room = "2.6.1"
work = "2.10.0"
okhttp = "4.12.0"
jsoup = "1.18.3"
serialization = "1.7.3"
coil = "2.7.0"
tink = "1.15.0"
junit = "4.13.2"
browser = "1.8.0"
